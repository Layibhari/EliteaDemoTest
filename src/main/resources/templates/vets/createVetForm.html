<!DOCTYPE html>

<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout (~{::body},'vets')}"
>

<body>

  <h2 th:text="#{addVet}">Add Veterinarian</h2>

  <form
    th:object="${vetForm}"
    th:action="@{/vets/new}"
    class="form-horizontal"
    id="add-vet-form"
    method="post"
  >

    <div class="form-group has-feedback">

      <input
        th:replace="~{fragments/inputField :: input (#{firstName}, 'firstName', 'text')}"
      />

      <input
        th:replace="~{fragments/inputField :: input (#{lastName}, 'lastName', 'text')}"
      />

    </div>

    <div class="form-group">

      <label
        class="col-sm-2 control-label"
        th:text="#{specialties}"
      >
        Specialties
      </label>

      <div class="col-sm-10">

        <div
          class="checkbox"
          th:each="specialty : ${specialties}"
        >
          <label>

            <input
              type="checkbox"
              th:field="*{specialtyIds}"
              th:value="${specialty.id}"
            />

            <span th:text="${specialty.name}">
              Specialty
            </span>

          </label>
        </div>

        <p class="help-block">
          A veterinarian may be added without a specialty.
        </p>

      </div>

    </div>

    <div class="form-group">

      <div class="col-sm-offset-2 col-sm-10">

        <button
          class="btn btn-primary"
          type="submit"
          th:text="#{addVet}"
        >
          Add Veterinarian
        </button>

        <a
          class="btn btn-default"
          th:href="@{/vets.html}"
        >
          Cancel
        </a>

      </div>

    </div>

  </form>

</body>

</html>
