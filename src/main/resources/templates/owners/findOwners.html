<!doctype html>

<html
  xmlns:th="https://www.thymeleaf.org"
  th:replace="~{fragments/layout :: layout (~{::body},'owners')}"
>
  <body>
    <h2 th:text="#{findOwners}">Find Owners</h2>

    <form
      th:object="${owner}"
      th:action="@{/owners}"
      method="get"
      class="form-horizontal"
      id="search-owner-form"
    >
      <!-- Last Name Search -->
      <div class="form-group">
        <div class="control-group" id="lastNameGroup">
          <label class="col-sm-2 control-label" th:text="#{lastName}">
            Last name
          </label>
          <div class="col-sm-10">
            <input
              class="form-control"
              th:field="*{lastName}"
              size="30"
              maxlength="80"
            />

            <span class="help-inline">
              <div th:if="${#fields.hasAnyErrors()}">
                <p th:each="err : ${#fields.allErrors()}" th:text="${err}">
                  Error
                </p>
              </div>
            </span>
          </div>
        </div>
      </div>

      <!-- Telephone Search -->
      <div class="form-group">
        <div class="control-group" id="telephoneGroup">
          <label class="col-sm-2 control-label"> Telephone </label>
          <div class="col-sm-10">
            <input
              class="form-control"
              th:field="*{telephone}"
              size="30"
              maxlength="10"
              placeholder="Enter 10-digit phone number"
            />
          </div>
        </div>
      </div>

      <!-- Search Button -->
      <div class="form-group">
        <div class="col-sm-offset-2 col-sm-10">
          <button type="submit" class="btn btn-primary" th:text="#{findOwner}">
            Find Owner
          </button>
        </div>
      </div>

      <!-- Add Owner Button -->
      <a class="btn btn-primary" th:href="@{/owners/new}" th:text="#{addOwner}">
        Add Owner
      </a>
    </form>
  </body>
</html>
