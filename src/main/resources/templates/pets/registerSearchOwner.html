<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'registerPet')}">

<body>

  <h2 th:text="#{registerPet}">Register a Pet</h2>

  <p th:text="#{registerPetInstructions}">Search for the pet's owner by last name to begin registration.</p>

  <div th:if="${error}" class="alert alert-danger" th:text="${error}">Error</div>

  <form th:action="@{/pets/register}" method="post" class="form-horizontal" id="search-owner-for-pet-form">
    <div class="form-group">
      <div class="control-group" id="lastNameGroup">
        <label class="col-sm-2 control-label" th:text="#{lastName}">Last name</label>
        <div class="col-sm-10">
          <input class="form-control" name="lastName" size="30" maxlength="80" />
        </div>
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <button type="submit" class="btn btn-primary" th:text="#{findOwner}">Find Owner</button>
      </div>
    </div>
  </form>

</body>

</html>
