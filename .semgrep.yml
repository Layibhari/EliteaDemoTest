rules:
  - id: java.spring.unsafe-jpql-string-concatenation
    languages:
      - java
    severity: WARNING
    message: User-controlled data appears to be concatenated into JPQL. Use named
      parameters with setParameter instead of building query strings from input.
    metadata:
      category: security
      cwe:
        - "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      technology:
        - spring
        - jpa
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: |
              String $QUERY = "..." + $VALUE + "...";
              ...
              $ENTITY_MANAGER.createQuery($QUERY, ...);
          - pattern: |
              $ENTITY_MANAGER.createQuery("..." + $VALUE + "...", ...);
