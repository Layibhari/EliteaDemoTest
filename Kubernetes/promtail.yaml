apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods
        pipeline_stages:
          - cri: {}
          - json:
              expressions:
                level: level
                logger: log.logger
                message: message
          - labels:
              level:
              logger:

        kubernetes_sd_configs:
          - role: pod

        relabel_configs:
          # Copy node name into __host__
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: __host__

          # Only keep pods in our target namespaces
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: petclinic|monitoring

          # Promote metadata into Loki labels
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container

          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app

          # ── Build __path__ in two steps to avoid multi-label join issues ──
          #
          # The previous approach joined 4 labels with ; and used a regex
          # to split them back into $1_$2_$3/$4 — but Promtail was resolving
          # the path incorrectly, using only the UID without the namespace
          # and pod name prefix.
          #
          # Instead we build the path incrementally:
          #
          # Step A: write namespace_podname_uid into a temp label __pod_path__
          - source_labels:
              - __meta_kubernetes_namespace
              - __meta_kubernetes_pod_name
              - __meta_kubernetes_pod_uid
            separator: "_"
            target_label: __pod_path__
            replacement: "$1"

          # Step B: combine __pod_path__ with the container name to form
          # the final log path on disk:
          #   /var/log/pods/<namespace>_<pod>_<uid>/<container>/*.log
          - source_labels:
              - __pod_path__
              - __meta_kubernetes_pod_container_name
            separator: "/"
            target_label: __path__
            replacement: /var/log/pods/$1/*.log
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
      - namespaces
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: monitoring
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      tolerations:
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: promtail
          image: grafana/promtail:3.0.0
          args:
            - "-config.file=/etc/promtail/promtail.yaml"
          env:
            # Override HOSTNAME with the actual node name.
            # Kubernetes sets HOSTNAME to the pod name by default.
            # Promtail reads HOSTNAME and uses it as a spec.nodeName
            # selector — without this it filters to the wrong node.
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 9080
          volumeMounts:
            - name: config-volume
              mountPath: /etc/promtail
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: promtail-run
              mountPath: /run/promtail
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsUser: 0
      volumes:
        - name: config-volume
          configMap:
            name: promtail-config
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: promtail-run
          emptyDir: {}