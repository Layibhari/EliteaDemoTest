name: docker workflow
on:
  workflow_dispatch:
    inputs:
      docker_image:
        default: spring
        type: string
        required: true
        DOCKERHUB_USERNAME:
          type: STRING
          default: 123sri
          required: true

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: install docker
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.123sri }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        if: ${{github.ref_name == 'main' }}
        with:
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.inputs.docker_image }}:${{ github.run_id}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        if: ${{github.ref_name != 'main' }}
        with:
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/${{ github.event.inputs.docker_image }}-spring-boot:${{ github.run_id}}
          
 
 
