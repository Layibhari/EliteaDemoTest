name: Package Template

on:
  workflow_call:

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Builder Image
        run: |
          docker build \
          -t java-builder:1.0 \
          docker/java-builder

      - name: Package Application
        run: |
          docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -w /workspace \
          java-builder:1.0 \
          mvn package -DskipTests
      
      - name: Show Target Directory
        run: ls -la target