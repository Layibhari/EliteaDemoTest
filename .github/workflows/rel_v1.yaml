---
name: release-branch

on:
  push:
    branches:
        - rel_v1

jobs:
    maven-build-job:
        runs-on: ubuntu-latest
        ermissions:
            contents: read
            packages: write
            security-events: write
        steps:
            - name: get the code
              uses: actions/checkout@v6
            - name: setup java
              uses: actions/setup-java@v5
              with:
                distribution: 'temurin'
                java-version: '21'
                server-id: github
                settings-path: ${{ github.workspace }}  
            - name: Initialize CodeQL
              uses: github/codeql-action/init@v4
              with:
                languages: java
            - name: package the code
              run: mvn clean package
            # - name: Perform code quality analysis
            #   uses: github/codeql-action/analyze@v4
            # - name: publish test results
            #   uses: EnricoMi/publish-unit-test-result-action@v2
            #   with:
            #     files: '**/target/surefire-reports/**/*.xml'
            #     comment_mode: always
            - name: publish package
              run: mvn deploy
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    docker-build-job:
        runs-on: ubuntu-latest
        steps:
            - name: get the code
              uses: actions/checkout@v6
            - name: setup docker buildx
              uses: docker/setup-buildx-action@v4
            - name: Login into Github Container Registry
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.GITHUB_TOKEN }}
            - name: Extract metadata
              id: metadata
              uses: docker/metadata-action@v6
              with:
                images: ghcr.io/${{ github.repository_owner }}/spring-petclinic

            - name: build the docker image
              uses: docker/build-push-action@v7
              with:
                push: true
                context: .
                tags: |
                    ghcr.io/${{ github.repository_owner }}/spring-petclinic:latest
                    ghcr.io/${{ github.repository_owner }}/spring-petclinic:${{ github.sha }}