name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # ─── MR JOBS (runs on Pull Requests only) ───────────────────────────────────

  checkstyle:
    name: Checkstyle
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: maven:3.8.5-openjdk-17
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkstyle
        run: mvn checkstyle:checkstyle -Dcheckstyle.failOnViolation=false

      - name: Upload Checkstyle Report
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/site/checkstyle.html
          retention-days: 7

  test:
    name: Test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: maven:3.8.5-openjdk-17
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Tests
        run: mvn test -DskipTests

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 7

  build:
    name: Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: maven:3.8.5-openjdk-17
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build without Tests
        run: mvn package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar
          retention-days: 7

  docker-mr:
    name: Build & Push Docker Image (MR)
    if: github.event_name == 'pull_request'
    needs: [checkstyle, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push to "mr" repo
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_REGISTRY }}/mr:${{ github.sha }}

  # ─── MAIN BRANCH JOB ────────────────────────────────────────────────────────

  docker-main:
    name: Build & Push Docker Image (Main)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push to "main" repo
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/main:${{ github.sha }}
            ${{ secrets.DOCKER_REGISTRY }}/main:latest
