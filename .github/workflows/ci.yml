name: Taller DevOps - Pipeline CI/CD

on:
  push:
    branches: [ "add-ci-pipeline", "feature/add-ci-pipeline" ]
  pull_request:
    branches: [ "add-ci-pipeline", "feature/add-ci-pipeline" ]

jobs:
  # =================================================================
  # JOB 1: VALIDACIÓN Y CALIDAD (PASOS 1, 2 Y 3)
  # =================================================================
  ci:
    name: Build, Security and Quality Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: SonarCloud Analysis
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        ./mvnw clean verify sonar:sonar \
          -Dsonar.organization=relic7663 \
          -Dsonar.projectKey=RELIC7663_spring-petclinic \
          -Dsonar.branch.name=main \
          -Dsonar.qualitygate.wait=true

    - name: Trivy FS Scan (Security)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        exit-code: '0'
        severity: 'CRITICAL,HIGH' 

  # =================================================================
  # JOB 2: EMPAQUETADO DOCKER (PASO 4) - Solo corre si el JOB 1 pasa
  # =================================================================
  docker:
    name: Build and Push Docker Image
    needs: ci # Exigencia del examen: depende directamente de la validación limpia de 'ci'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. Configurar QEMU y Docker Buildx para permitir compilaciones multi-etapa eficientes
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 2. Autenticarse en GitHub Packages Registry usando tus variables de entorno nativas
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }} 
        # Nota: Usamos el token automático de GitHub Actions que tiene permisos de lectura/escritura integrados

    # 3. Construir la imagen usando el Dockerfile multi-stage y subirla automáticamente a ghcr.io
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        # Convierte el nombre de usuario a minúsculas automáticamente para evitar rechazos en las URLs de ghcr.io
        tags: |
          ghcr.io/${{ github.repository_owner }}/spring-petclinic-devops:${{ github.sha }}
          ghcr.io/${{ github.repository_owner }}/spring-petclinic-devops:latest