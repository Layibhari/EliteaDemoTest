name: Universal CI

on:
  push:
    branches:
      - main
      - feature/*

jobs:

  detect:
    runs-on: ubuntu-latest

    outputs:
      language: ${{ steps.detect.outputs.language }}

    steps:
      - uses: actions/checkout@v4

      - id: detect
        run: bash scripts/detect.sh

  build-java:
    needs: detect
    if: needs.detect.outputs.language == 'java'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to JFrog
        run: |
          echo "${{ secrets.JFROG_PASSWORD }}" | docker login trial2zs76n.jfrog.io \
            -u "${{ secrets.JFROG_USER }}" \
            --password-stdin

      - name: Build Java
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            trial2zs76n.jfrog.io/docker-local/java-builder:1.0 \
            mvn clean package -DskipTests

  build-python:
    needs: detect
    if: needs.detect.outputs.language == 'python'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to JFrog
        run: |
          echo "${{ secrets.JFROG_PASSWORD }}" | docker login trial2zs76n.jfrog.io \
            -u "${{ secrets.JFROG_USER }}" \
            --password-stdin

      - name: Build Python
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            trial2zs76n.jfrog.io/docker-local/python-builder:1.0 \
            sh -c "pip install -r requirements.txt && python -m build || true"

  build-go:
    needs: detect
    if: needs.detect.outputs.language == 'go'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to JFrog
        run: |
          echo "${{ secrets.JFROG_PASSWORD }}" | docker login trial2zs76n.jfrog.io \
            -u "${{ secrets.JFROG_USER }}" \
            --password-stdin

      - name: Build Go
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            trial2zs76n.jfrog.io/docker-local/go-builder:1.0 \
            sh -c "mkdir -p dist && go mod download && go build -o dist/app ."

  publish:
    needs:
      - build-java
      - build-python
      - build-go

    if: |
      needs.build-java.result == 'success' ||
      needs.build-python.result == 'success' ||
      needs.build-go.result == 'success'

    uses: ./.github/workflows/publish.yml

    secrets: inherit