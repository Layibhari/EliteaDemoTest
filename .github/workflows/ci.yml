name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - '.mvn/**'
      - 'mvnw'
      - 'Dockerfile'
      - 'Dockerfile.runtime'
      - '.dockerignore'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload JAR artifact (JDK 17 only)
        if: matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: petclinic-jar
          path: target/*.jar
          retention-days: 1
          if-no-files-found: error

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: petclinic-jar
          path: target/

      - name: List downloaded files (sanity check)
        run: ls -lh target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.runtime
          push: false
          tags: petclinic:${{ github.sha }}
          load: true

      - name: Show image size
        run: docker images petclinic:${{ github.sha }}
