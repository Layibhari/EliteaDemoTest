name: Taller DevOps - Pipeline CI

on:
  push:
    branches: [ "add-ci-pipeline", "feature/add-ci-pipeline" ]
  pull_request:
    branches: [ "add-ci-pipeline", "feature/add-ci-pipeline" ]

jobs:
  ci:
    name: Build, Security and Quality Analysis
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código fuente
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Obligatorio para que SonarCloud lea el historial de Git

    # 2. Configurar Java JDK 17
    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Cachear paquetes de Maven para acelerar el pipeline
    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    # 4. PASO 3: Análisis de Calidad simulando la rama principal para el plan gratuito
    - name: SonarCloud Analysis
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        ./mvnw clean verify sonar:sonar \
          -Dsonar.organization=relic7663 \
          -Dsonar.projectKey=RELIC7663_spring-petclinic \
          -Dsonar.branch.name=main \
          -Dsonar.qualitygate.wait=true

    # 5. PASO 3 DEL EXAMEN: Escaneo de vulnerabilidades del código con Trivy
    - name: Trivy FS Scan (Security)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'table'
        exit-code: '0' # Permite que el pipeline termine para que veas el reporte en la consola
        severity: 'CRITICAL,HIGH'