name: "Frogbot Scan Repository"
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  id-token: write
  pull-requests: write
  contents: write
  security-events: write
jobs:
  scan-repository:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: ["main"]
    steps:
      - uses: jfrog/frogbot@v2
        env:
          JF_URL: https://${{ vars.JFROG_REGISTRY }}
          #JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JF_GIT_BASE_BRANCH: ${{ matrix.branch }}
          #JF_RELEASES_REPO: ${{ secrets.JFROG_MAVEN_REPO }}-release
        with:
          oidc-provider-name: github