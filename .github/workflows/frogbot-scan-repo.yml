name: "Frogbot Repo Scan and Fix"
on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight. Customize as needed.
  workflow_dispatch: # Allows manual trigger from the Actions tab.

permissions:
  contents: write
  pull-requests: write

jobs:
  frogbot-repo-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Frogbot Repo Scan
        uses: jfrog/frogbot@v2
        with:
          frogbot-command: "scan-repository"
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
