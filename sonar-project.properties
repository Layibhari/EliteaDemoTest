# ---- Project identity (must match SonarQube project key) ----
sonar.projectKey=spring-petclinic
sonar.projectName=Spring PetClinic
sonar.projectVersion=4.0.0-SNAPSHOT

# ---- Source/Test layout ----
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.libraries=target/dependency/*.jar
sonar.sourceEncoding=UTF-8

# ---- Coverage & test reports ----
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

# ---- Exclusions ----
sonar.exclusions=**/target/**,**/*.min.js,**/*.min.css,**/node_modules/**,src/main/resources/static/**,src/main/resources/db/**
sonar.coverage.exclusions=**/PetClinicApplication.java,**/*Configuration.java,**/model/**,**/dto/**
