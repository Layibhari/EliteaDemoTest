---
# ============================================================
# ExternalSecret — syncs AWS Secrets Manager → K8s Secret
# ============================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: petclinic-db-secret
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: demo-db
    creationPolicy: Owner
  data:
    - secretKey: host
      remoteRef:
        key: petclinic/db-credentials
        property: host
    - secretKey: port
      remoteRef:
        key: petclinic/db-credentials
        property: port
    - secretKey: database
      remoteRef:
        key: petclinic/db-credentials
        property: database
    - secretKey: username
      remoteRef:
        key: petclinic/db-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: petclinic/db-credentials
        property: password
