---
# ============================================================
# ClusterSecretStore — connects to AWS Secrets Manager
# ============================================================
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets

---
# ============================================================
# ServiceAccount — annotated with IAM role ARN
# ============================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: external-secrets
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::708309164311:role/petclinic-external-secrets-role
