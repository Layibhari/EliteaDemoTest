env:
  contexts:
    - name: petclinic
      urls:
        - http://app:8080/

jobs:
  - type: spider
    parameters:
      context: petclinic
      maxDuration: 60

  - type: activeScan
    parameters:
      context: petclinic
      maxRuleDurationInMins: 2

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/reports
      reportFile: petclinic-zap-report.html
