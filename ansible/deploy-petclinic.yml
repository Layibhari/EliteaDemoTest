---
- name: Deploy Spring PetClinic to the production VM
  hosts: petclinic
  become: true
  vars:
    petclinic_user: petclinic
    petclinic_group: petclinic
    petclinic_home: /opt/petclinic
    petclinic_service_name: petclinic
    petclinic_port: 8080
    petclinic_jar_path: ../target/spring-petclinic-4.0.0-SNAPSHOT.jar
    petclinic_app_url: "http://localhost:8080"

  tasks:
    - name: Install Java runtime
      ansible.builtin.apt:
        name: openjdk-21-jre-headless
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Create PetClinic group
      ansible.builtin.group:
        name: "{{ petclinic_group }}"
        system: true

    - name: Create PetClinic user
      ansible.builtin.user:
        name: "{{ petclinic_user }}"
        group: "{{ petclinic_group }}"
        home: "{{ petclinic_home }}"
        shell: /usr/sbin/nologin
        system: true
        create_home: false

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ petclinic_home }}"
        state: directory
        owner: "{{ petclinic_user }}"
        group: "{{ petclinic_group }}"
        mode: "0755"

    - name: Copy PetClinic jar
      ansible.builtin.copy:
        src: "{{ petclinic_jar_path }}"
        dest: "{{ petclinic_home }}/spring-petclinic.jar"
        owner: "{{ petclinic_user }}"
        group: "{{ petclinic_group }}"
        mode: "0644"
      notify: Restart petclinic

    - name: Install systemd unit
      ansible.builtin.template:
        src: templates/petclinic.service.j2
        dest: "/etc/systemd/system/{{ petclinic_service_name }}.service"
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart petclinic

    - name: Enable and start PetClinic
      ansible.builtin.systemd:
        name: "{{ petclinic_service_name }}"
        enabled: true
        state: started
        daemon_reload: true

    - name: Wait for PetClinic health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ petclinic_port }}/actuator/health"
        return_content: true
        status_code: 200
      register: petclinic_health
      retries: 30
      delay: 3
      until: petclinic_health.status == 200

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart petclinic
      ansible.builtin.systemd:
        name: "{{ petclinic_service_name }}"
        state: restarted
